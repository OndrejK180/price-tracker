name: Daily price scrape

# POZNÁMKA: automatické plánované spouštění (schedule/cron) bylo záměrně
# odstraněno. Datart.cz blokuje požadavky z cloudových IP adres GitHub
# Actions (bot-detekce F5/TSPD) - viz kapitola 11 v dokumentaci projektu.
# Produkční denní běh teď zajišťuje Windows Task Scheduler na lokálním
# počítači. Workflow necháváme jen pro ruční spuštění (např. při pozdějším
# testování proxy řešení), aby nechodily denní e-maily o neúspěšném běhu.
on:
  workflow_dispatch:

jobs:
  scrape-and-load:
    runs-on: ubuntu-latest
    # Pojistka: kdyby se něco zaseklo, job se po 15 minutách sám ukončí.
    timeout-minutes: 15

    steps:
      # Stáhne kód z repozitáře na čistý virtuální stroj.
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # Ukládá stažené balíčky do cache, další běhy jsou rychlejší.
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scrape Datart and load into Supabase
        run: python load_to_supabase.py
        env:
          # Heslo NIKDY nepíšeme do kódu. Načítá se z GitHub Secrets
          # (Settings -> Secrets and variables -> Actions).
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
