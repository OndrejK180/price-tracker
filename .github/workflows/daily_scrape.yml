name: Daily price scrape

on:
  # Automatické spouštění každý den v 05:00 UTC (cca 7:00 českého času).
  # Cron formát: minuta hodina den-v-měsíci měsíc den-v-týdnu. Čas je vždy UTC.
  schedule:
    - cron: "0 5 * * *"
  # Tlačítko "Run workflow" v záložce Actions - pro ruční test bez čekání na cron.
  workflow_dispatch:

jobs:
  scrape-and-load:
    runs-on: ubuntu-latest
    # Pojistka: kdyby se něco zaseklo, job se po 15 minutách sám ukončí.
    timeout-minutes: 15

    steps:
      # Stáhne kód z repozitáře na čistý virtuální stroj.
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # Ukládá stažené balíčky do cache, další běhy jsou rychlejší.
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scrape Datart and load into Supabase
        run: python load_to_supabase.py
        env:
          # Heslo NIKDY nepíšeme do kódu. Načítá se z GitHub Secrets
          # (Settings -> Secrets and variables -> Actions).
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
